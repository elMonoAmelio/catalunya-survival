name: Actualizar horarios de Rodalies
on:
  schedule:
    - cron: '17 2 * * *'
    - cron: '41 4 * * *'   # respaldo: GitHub a veces se salta la primera
  push:
    paths:
      - 'rodalies-build/bundle.js'
      - 'rodalies-build/template.html'
      - 'rodalies-build/build.py'
      - 'rodalies.html'
      - '.github/workflows/rodalies.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rodalies
  cancel-in-progress: false
jobs:
  horarios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: pip install numpy scipy
      - name: Descargar el GTFS oficial de Renfe (Cercanías y Rodalies)
        working-directory: rodalies-build
        run: |
          curl -fsSL --retry 3 --max-time 300 -o gtfs.zip https://ssl.renfe.com/ftransit/Fichero_CER_FOMENTO/fomento_transit.zip \
          || curl -fsSL --retry 3 --max-time 300 -o gtfs.zip https://files.mobilitydatabase.org/mdb-2653/latest.zip
          mkdir -p gtfs && unzip -o -q gtfs.zip -d gtfs && ls -la gtfs
      - name: Construir rodalies.html (hoy + 9 días)
        working-directory: rodalies-build
        run: |
          python build.py "$(TZ=Europe/Madrid date +%F)" 9
          python route.py
          python pack.py
          python assemble.py ../rodalies.html
          python assemble.py ../rodalies-original.html original   # copia congelada del diseño de la v1.148, con horarios al día
      - name: Horario suelto para la app (rama horarios)
        # la app Andana lo descarga al abrirse: así su horario no caduca aunque no se reinstale
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/hor && mkdir /tmp/hor && cp rodalies-build/rod_pack.json /tmp/hor/rod_pack.json
          cd /tmp/hor && git init -q && git add rod_pack.json \
            && git -c user.name=MonkiSoft -c user.email=elMonoAmelio@users.noreply.github.com commit -qm "Horario de Rodalies $(TZ=Europe/Madrid date +%d/%m/%Y)" \
            && git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:horarios || echo "subida del horario fallida"
      - name: Publicar si ha cambiado
        run: |
          git config user.name "MonkiSoft"
          git config user.email "elMonoAmelio@users.noreply.github.com"
          # la app Andana lleva la misma web dentro: se actualiza a la vez
          if [ -d andana/www ]; then cp rodalies.html andana/www/index.html; mkdir -p andana/ios/App/App/public && cp rodalies.html andana/ios/App/App/public/index.html; git add andana/www/index.html andana/ios/App/App/public/index.html; fi
          git add rodalies.html rodalies-original.html
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Horarios de Rodalies $(TZ=Europe/Madrid date +%d/%m/%Y)"
          # si mientras tanto se ha subido otra versión, esa ejecución ya publicará: esta no falla
          if ! git push; then git fetch origin main; if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD~1)" ]; then echo "Hay una versión más nueva en main; la publicará su propia ejecución"; exit 0; fi; exit 1; fi
