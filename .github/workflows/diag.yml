name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; B=https://rodalies.erathegameoftime.com
          curl -s -m 40 "$B/live.json" -o out/live.json
          curl -s -m 20 "$B/estado.json" -o out/estado.json
          for s in 79009 79410; do curl -s -m 20 "$B/departures.json?stationId=$s" -o out/dep_$s.json; done
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: diag, path: out }
