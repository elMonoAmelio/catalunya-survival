name: diag
on: workflow_dispatch
permissions: { contents: write }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out; B=https://rodalies.jhmuyo.workers.dev
          curl -s -m 40 "$B/live.json" -o live.json
          curl -s -m 20 "$B/estado.json" -o estado.json
          for s in 79009 79410; do curl -s -m 20 "$B/departures.json?stationId=$s" -o dep_$s.json; done
          git init -q; git checkout -q -b diag; git add .; git -c user.name=MonkiSoft -c user.email=elMonoAmelio@users.noreply.github.com commit -qm diag
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag
