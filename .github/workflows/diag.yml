name: Diagnóstico Renfe
on:
  push:
    paths: ['.github/workflows/diag.yml']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          G=https://serveisgrs.rodalies.gencat.cat/api
          for n in 25600 25608 25703 25610 25612; do curl -s -m 30 "$G/trains/$n?fullResponse=true&lang=es" -o t_$n.json; echo "train $n $(wc -c < t_$n.json)" >> resumen.txt; done
          curl -s -m 30 "$G/departures?lang=es&fullResponse=true&stationId=79410" -o dep.json; echo "dep $(wc -c < dep.json)" >> resumen.txt
          curl -s -m 30 "$G/init?lang=es" -o init.json; echo "init $(wc -c < init.json)" >> resumen.txt
          curl -s -m 30 https://gtfsrt.renfe.com/vehicle_positions.json -o gtfs_vp.json; echo "gtfs vp $(wc -c < gtfs_vp.json)" >> resumen.txt
          python3 - <<'P' >> resumen.txt
          import json
          print(open('t_25600.json').read()[:2500])
          d=json.load(open('dep.json')); T=d.get('trains') or []
          print('dep trains', len(T)); print(json.dumps(T[0])[:1500] if T else '')
          print('init', open('init.json').read()[:600])
          P
          git init -q && git checkout -q -b diag && git add . && git -c user.name=MonkiSoft -c user.email=elMonoAmelio@users.noreply.github.com commit -qm diag
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag
