name: Estadísticas de Rodalies
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    paths:
      - '.github/workflows/stats.yml'
      - 'rodalies-build/stats.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stats
  cancel-in-progress: false
jobs:
  foto:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar lo acumulado
        run: |
          mkdir -p /tmp/st
          if git fetch -q origin stats; then
            git show origin/stats:hoy.json > /tmp/st/hoy.json 2>/dev/null || rm -f /tmp/st/hoy.json
            git show origin/stats:ayer.json > /tmp/st/ayer.json 2>/dev/null || rm -f /tmp/st/ayer.json
          fi
      - name: Foto del tiempo real de Renfe
        run: python3 rodalies-build/stats.py /tmp/st
      - name: Guardar en la rama stats (un solo commit, sin historial)
        run: |
          git config user.name "MonkiSoft"
          git config user.email "elMonoAmelio@users.noreply.github.com"
          git checkout -q --orphan stats-tmp
          git rm -rfq .
          cp /tmp/st/*.json .
          git add -- *.json
          git commit -qm "Estadísticas de Rodalies"
          git push -qf origin stats-tmp:stats
