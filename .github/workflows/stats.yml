name: Estadísticas de Rodalies
# Foto del tiempo real de Renfe cada 15 min. Como GitHub no garantiza las tareas programadas frecuentes,
# el trabajo se queda en marcha ~5 h haciendo una foto cada 15 min y, al terminar, se vuelve a lanzar solo.
# La tarea horaria es solo de respaldo por si la cadena se corta.
on:
  schedule:
    - cron: '7 * * * *'
  push:
    paths:
      - '.github/workflows/stats.yml'
      - 'rodalies-build/stats.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: stats
  cancel-in-progress: false
jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Fotos cada 15 min durante unas 5 horas
        run: |
          git config user.name "MonkiSoft"
          git config user.email "elMonoAmelio@users.noreply.github.com"
          cp rodalies-build/stats.py /tmp/stats.py
          for i in $(seq 1 20); do
            mkdir -p /tmp/st && rm -f /tmp/st/*.json
            if git fetch -q origin stats; then
              git show FETCH_HEAD:hoy.json > /tmp/st/hoy.json 2>/dev/null || rm -f /tmp/st/hoy.json
              git show FETCH_HEAD:ayer.json > /tmp/st/ayer.json 2>/dev/null || rm -f /tmp/st/ayer.json
              git show FETCH_HEAD:hist.json > /tmp/st/hist.json 2>/dev/null || rm -f /tmp/st/hist.json
              git show FETCH_HEAD:dias.json > /tmp/st/dias.json 2>/dev/null || rm -f /tmp/st/dias.json
            fi
            python3 /tmp/stats.py /tmp/st || echo "foto fallida"
            rm -rf /tmp/pub && mkdir /tmp/pub && cd /tmp/pub && git init -q && cp /tmp/st/*.json . \
              && git add -- *.json && git -c user.name=MonkiSoft -c user.email=elMonoAmelio@users.noreply.github.com commit -qm "Estadísticas de Rodalies" \
              && git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:stats || echo "subida fallida"
            cd "$GITHUB_WORKSPACE"
            # respaldo de los horarios: si GitHub no ha lanzado la tarea de horarios de esta noche, se lanza desde aquí (de 3 a 9 h)
            H=$(TZ=Europe/Madrid date +%H)
            if [ "$H" -ge 3 ] && [ "$H" -le 9 ]; then
              DESDE=$(date -u -d "TZ=\"Europe/Madrid\" $(TZ=Europe/Madrid date +%F) 00:00" +%FT%TZ)
              N=$(GH_TOKEN="$GITHUB_TOKEN" gh run list -R "$GITHUB_REPOSITORY" -w rodalies.yml -L 20 --json createdAt,event -q "[.[]|select(.event!=\"push\")|select(.createdAt>=\"$DESDE\")]|length" 2>/dev/null || echo 1)
              if [ "$N" = "0" ]; then echo "Horarios de hoy sin lanzar: se lanzan"; GH_TOKEN="$GITHUB_TOKEN" gh workflow run rodalies.yml --ref main -R "$GITHUB_REPOSITORY" || true; fi
            fi
            if [ "$i" -lt 20 ]; then sleep 900; fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Volver a lanzarse
        if: success() || failure()
        run: gh workflow run stats.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
